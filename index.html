<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Token Simulator</h1>
        <p>Educational Purpose - No Real Money</p>
        
        <div class="counter">Tokens: <span id="tokens">0</span></div>
        
        <div class="buttons">
            <button class="upgrade" onclick="buyUpgrade(1, 10)">
                Upgrade 1 (+1 token/sec)<br>
                <small>Cost: 10 tokens</small>
            </button>
            <button class="upgrade" onclick="buyUpgrade(5, 100)">
                Upgrade 2 (+5 tokens/sec)<br>
                <small>Cost: 100 tokens</small>
            </button>
            <button class="upgrade" onclick="buyUpgrade(10, 500)">
                Factory (+10 tokens/sec)<br>
                <small>Cost: 500 tokens</small>
            </button>
            
            <div class="action-buttons">
                <button class="action-btn achievements" onclick="showAchievements()">
                    Achievements 🏆
                </button>
                <button class="action-btn save" onclick="saveGame()">
                    Save Game
                </button>
                <button class="action-btn reset" onclick="resetGame()">
                    Reset Game
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
