
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه ساز آموزشی اقتصاد توکن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>شبیه ساز آموزشی اقتصاد توکن</h1>
        <p>این یک ابزار آموزشی است. هیچ پول واقعی در کار نیست.</p>
        
        <div class="counter">توکن های شما: <span id="tokens">0</span></div>
        
        <div>
            <button class="upgrade" onclick="buyUpgrade(1, 10)">
                خرید ماینر سطح 1 (+1 توکن/ثانیه)<br>
                <small>هزینه: 10 توکن</small>
            </button>
            <button class="upgrade" onclick="buyUpgrade(5, 100)">
                خرید ماینر سطح 2 (+5 توکن/ثانیه)<br>
                <small>هزینه: 100 توکن</small>
            </button>
            <button class="upgrade" onclick="buyUpgrade(10, 500)">
                خرید کارخانه ماینینگ (+10 توکن/ثانیه)<br>
                <small>هزینه: 500 توکن</small>
            </button>
            
            <br>
            <button class="upgrade" onclick="resetGame()" style="background: #e74c3c;">
                ریست کردن بازی
            </button>
            <button class="upgrade" onclick="saveGame()" style="background: #27ae60;">
                ذخیره دستی
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
